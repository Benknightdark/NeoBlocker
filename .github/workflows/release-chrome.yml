name: Release Chrome Extension

on:
  pull_request:
    branches:
      - main
    types:
      - closed # 當 PR 被關閉時觸發

jobs:
  release:
    # 只有在 PR 被成功 merge（而不是單純關閉）時才執行發佈
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: cd.yml          # CD 腳本的檔案名稱
          branch: develop           # 指定 develop 分支
          name: extension-zip       # 上傳時定義的 artifact 名稱
          path: .output/            # 下載至目標路徑
          workflow_conclusion: success # 必須是成功運行的產物

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Submit to Chrome Web Store
        run: npx wxt submit --chrome-zip .output/lionblock-${{ steps.get_version.outputs.version }}-chrome.zip
        env:
          WXT_SUBMIT_CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          WXT_SUBMIT_CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          WXT_SUBMIT_CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          WXT_SUBMIT_CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
