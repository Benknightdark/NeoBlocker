name: Release Chrome Extension

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  release:
    # 只有在 PR 被成功 merge 至 main（而非單純關閉）時執行發佈
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build DNR Rules
        run: npm run build:dnr

      - name: Build and Zip Extension
        run: npm run zip

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Submit to Chrome Web Store
        run: npx wxt submit --chrome-zip .output/lionblock-${{ steps.get_version.outputs.version }}-chrome.zip
        env:
          WXT_SUBMIT_CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          WXT_SUBMIT_CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          WXT_SUBMIT_CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          WXT_SUBMIT_CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
