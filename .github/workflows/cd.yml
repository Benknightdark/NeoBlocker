name: CD (Continuous Delivery)

on:
  push:
    branches:
      - develop

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build DNR Rules
        run: npm run build:dnr

      - name: Build Extension
        run: npm run build

      - name: Install Playwright Browsers & Deps
        run: npx playwright install chromium --with-deps

      - name: Run E2E Tests
        run: xvfb-run npm run test:e2e

  prepare-release:
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create Pull Request to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "Release Prep: merge develop to main" \
            --body "Automated PR to merge develop into main after successful tests." || echo "Pull Request already exists or could not be created."
